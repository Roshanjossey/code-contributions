<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asra Fatma</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #24292f;
            max-width: 650px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .profile-link {
            text-decoration: none;
            color: inherit;
            display: inline-block;
            transition: color 0.2s ease;
        }

        .profile-link:hover {
            color: #0969da;
            text-decoration: underline;
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        p {
            color: #57606a;
            margin-bottom: 1.5rem;
        }

        h4 {
            font-size: 1rem;
            margin: 1.25rem 0 0.5rem;
            color: #24292f;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .badge {
            padding: 0.35rem 0.75rem;
            border-radius: 0.35rem;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            letter-spacing: 0.02em;
        }

        .icon {
            width: 2.25rem;
            height: 2.25rem;
            transition: transform 0.2s ease;
        }

        .icon:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <article>
        <h3>
            <a 
                class="profile-link" 
                href="https://github.com/asrafatma" 
                target="_blank" 
                rel="noopener noreferrer"
            >
                asrafatma
            </a>
        </h3>
        <p>Software Engineering Student passionate about building clean web applications, exploring open-source software, and solving real-world problems through code.</p>
        
        <h4>Programming languages I use</h4>
        <section class="container">
            <div class="badge" style="background-color: #3776AB; color: white;">
                Python
            </div>
            <div class="badge" style="background-color: #F7DF1E; color: black;">
                JavaScript
            </div>
            <div class="badge" style="background-color: #007396; color: white;">
                Java
            </div>
            <div class="badge" style="background-color: #00599C; color: white;">
                C++
            </div>
        </section>

        <h4>Tools & Technologies I use</h4>
        <section class="container">
            <img
                class="icon"
                title="Git"
                alt="Git"
                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original.svg"
            />
            <img
                class="icon"
                title="GitHub"
                alt="GitHub"
                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/github/github-original.svg"
            />
            <img
                class="icon"
                title="VS Code"
                alt="VS Code"
                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg"
            />
            <img
                class="icon"
                title="Figma"
                alt="Figma"
                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/figma/figma-original.svg"
            />
            <img
                class="icon"
                title="Linux"
                alt="Linux"
                src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/linux/linux-original.svg"
            />
        </section>
    </article>
</body>
</html>
