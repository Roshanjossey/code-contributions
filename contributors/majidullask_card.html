<style>
:root { --bg-light: #f0f4f8; --bg-dark: #111; --card-bg: rgba(255,255,255,0.07); }
[data-theme="dark"] { --bg: var(--bg-dark); color: #e0e0e0; }
[data-theme="light"] { --bg: var(--bg-light); color: #222; }
html { background: linear-gradient(135deg, #6dd5fa, #2980b9); background-attachment: fixed; }
body { margin:0; font-family: 'Inter', sans-serif; }
.card { max-width:720px; margin:auto; padding:2rem; background: var(--card-bg); backdrop-filter: blur(12px); border-radius:1rem; box-shadow:0 4px 30px rgba(0,0,0,0.2); }
.badge { display:inline-block; margin:0.3rem; padding:0.3rem 0.6rem; border-radius:999px; background:#fff; color:#333; }
.badge:hover { transform:scale(1.05); transition:transform 0.2s; }
.container { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; }
.icon { width:2rem; height:2rem; }
.social a { margin-right:0.5rem; }
.avatar { display:block; margin:0.5rem 0; }
</style>

<script>
const toggle=document.createElement('button');
toggle.textContent='🌙';
toggle.style.position='fixed'; toggle.style.top='1rem'; toggle.style.right='1rem'; toggle.style.zIndex='1000';
document.body.appendChild(toggle);
toggle.onclick=()=>{document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';};
</script>
