<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HERE I AM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #002fa7;
            overflow: hidden;
            font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
        }

        .container {
            text-align: left;
        }

        .text {
            font-size: clamp(6rem, 22vw, 20rem);
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 0.9;
            user-select: none;
            -webkit-text-stroke: 1px #ffffff;
        }

        .subtitle {
            margin-top: 1.5rem;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1;
            user-select: none;
            -webkit-text-stroke: 1px #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="subtitle">with python or more</div>
        <div class="text">
            BlueB
        </div>
        <div class="subtitle">
            READY TO GO
        </div>
    </div>
</body>
</html>
