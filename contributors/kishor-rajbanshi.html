<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kishor Rajbanshi · GitHub</title>

    <!-- GitHub official markdown CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ================= BASE ================= */
        html,
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        a {
            color: #2f81f7;
            text-decoration: none;
        }

        /* ================= LAYOUT ================= */
        .page {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
        }

        .layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        /* ================= PROFILE ================= */
        .profile {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 16px;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
        }

        .profile img {
            width: 100%;
            border-radius: 50%;
        }

        .profile h1 {
            margin: 16px 0 4px;
            font-size: 20px;
        }

        .profile h2 {
            margin: 0 0 12px;
            font-size: 15px;
            color: #8b949e;
            font-weight: 400;
        }

        .view_github_profile {
            margin: 15px 0 15px;
            text-align: center;
            background-color: #35435b;
            padding: 8px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid #d1d5da;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            width: 100%;
        }

        .view_github_profile:hover {
            background-color: #3f4f6b;
        }

        .meta {
            font-size: 14px;
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 6px;
            word-break: break-word;
        }

        /* ================= README ================= */
        .content {
            flex: 1;
            min-width: 0;
            /* CRITICAL: prevents overflow */
        }

        .markdown-body {
            background: transparent;
            color: #c9d1d9;
            max-width: 100%;
            overflow-wrap: anywhere;
        }

        /* Fix GitHub badge / icon backgrounds */
        .markdown-body img {
            background: transparent !important;
            max-width: 100%;
            height: auto;
        }

        /* Prevent tables / grids from overflowing */
        .markdown-body table {
            display: block;
            width: 100%;
            overflow-x: auto;
        }

        .markdown-body pre {
            background-color: #010409;
            overflow-x: auto;
        }

        /* ================= MOBILE ================= */
        @media (max-width: 900px) {
            .layout {
                flex-direction: column;
            }

            .profile {
                position: static;
                width: 100%;
            }

            .page {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="layout">

            <!-- PROFILE -->

            <aside class="profile">
                <div class="card">
                    <img id="avatar" alt="avatar" />
                    <h1 id="name"></h1>
                    <h2 id="login"></h2>
                    <div class="meta" id="bio"></div>
                    <div class="meta"><button class="view_github_profile" id="view_github_profile">GitHub
                            Profile</button></div>
                    <div class="meta" id="stats"></div>
                    <div class="meta" id="location">location</div>
                    <div class="meta" id="timezone"></div>
                    <div class="meta" id="email"></div>
                    <div class="meta" id="company"></div>
                    <div class="meta" id="blog"></div>
                    <div class="meta" id="twitter"></div>
                    <hr style="border:1px solid #30363d; margin:16px 0" />
                    <strong class="meta">Gists</strong>
                    <ul id="gists" style="list-style:none; padding:0; margin:8px 0 0"></ul>
                    <hr style="border:1px solid #30363d; margin:16px 0" />
                    <strong class="meta">Repositories</strong>
                    <ul id="repos" style="list-style:none; padding:0; margin:8px 0 0"></ul>
                </div>
            </aside>

            <!-- README -->

            <main class="content">
                <div class="card">
                    <div id="readme" class="markdown-body">Loading…</div>
                </div>
            </main>

        </div>
    </div>

    <script>
        const username = 'kishor-rajbanshi';
        const timezone = "Asia/Kathmandu";

        fetch(`https://api.github.com/users/${username}`)
            .then(r => r.json())
            .then(u => {
                avatar.src = u.avatar_url;
                document.getElementById('name').textContent = u.name;
                login.textContent = `@${u.login}`;
                bio.textContent = u.bio;
                view_github_profile.innerHTML = `<a href="${u.html_url}" target="_blank">View GitHub Profile</a>`;
                stats.textContent = `👥 ${u.followers} followers · ${u.following} following`;
                document.getElementById('location').textContent = `🌎 ${u.location}`;
                // email.textContent = `✉️ ${u.email}`;
                company.textContent = u.company;
                if (u.blog) {
                    blog.innerHTML = `🔗: <a href="${u.blog}" target="_blank">${u.blog}</a>`;
                }
                if (u.twitter_username) {
                    twitter.innerHTML = `X: <a href="https://x.com/${u.twitter_username}" target="_blank">@${u.twitter_username}</a>`;
                }
            });

        const time = new Date().toLocaleTimeString("en-GB", {
            timeZone: timezone,
            hour: "2-digit",
            minute: "2-digit"
        });
        document.getElementById('timezone').textContent = `🕓 ${time} (UTC +05:45)`;

        fetch(`https://raw.githubusercontent.com/${username}/${username}/main/README.md`)
            .then(r => r.text())
            .then(md => {
                readme.innerHTML = marked.parse(md, { headerIds: false, mangle: false });
            })
            .catch(() => readme.textContent = 'Unable to load README');

        fetch(`https://api.github.com/users/${username}/gists?per_page=10&sort=updated`)
            .then(r => r.json())
            .then(list => {
                if (!list.length) {
                    const li = document.createElement('li');
                    li.innerHTML = 'No public gists';
                    gists.appendChild(li);
                    return;
                }
                list.filter(r => !r.fork).forEach(r => {
                    const li = document.createElement('li');
                    li.style.marginBottom = '8px';
                    li.innerHTML = `<a href="${r.html_url}" target="_blank">${Object.values(r.files)[0].filename}</a><br><small>${r.description}</small>`;
                    gists.appendChild(li);
                });
            });

        fetch(`https://api.github.com/users/${username}/repos?per_page=10&sort=updated`)
            .then(r => r.json())
            .then(list => {
                if (!list.length) {
                    const li = document.createElement('li');
                    li.innerHTML = 'No public repositories';
                    repos.appendChild(li);
                    return;
                }
                list.filter(r => !r.fork).forEach(r => {
                    const li = document.createElement('li');
                    li.style.marginBottom = '8px';
                    li.innerHTML = `<a href="${r.html_url}" target="_blank">${r.name}</a><br><small>${r.description}</small>`;
                    repos.appendChild(li);
                });
            });
    </script>

</body>

</html>
